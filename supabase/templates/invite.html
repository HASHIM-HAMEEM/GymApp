<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Meridian invitation</title>
  </head>
  <body>
    <main>
      <h1>Welcome to Meridian Athletic Club</h1>
      <p>Your membership account is ready. Use this one-time link to accept your invitation and choose a password.</p>
      <p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=invite">Accept invitation</a></p>
      <p>If you were not expecting this invitation, you can ignore this email.</p>
    </main>
  </body>
</html>
